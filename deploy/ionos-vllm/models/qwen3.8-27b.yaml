# Qwen3.8-27B, FP8 — dense, ~31 GB weights. The main chat model (port 8000).
# Same model as the Spark baseline (setup S4 in
# docs/benchmarks/Modelltest_Spark_vs_H200.xlsx).
#
# Keys are `vllm serve` flags without the leading `--`. Host, port and API key
# come from docker-compose.yml.

model: Qwen/Qwen3.8-27B-FP8
# Talos switches on its Qwen sampling profiles and the reasoning-effort knob
# only when the served name contains "qwen" (src/llm_core.py).
served-model-name: qwen3.8-27b

tensor-parallel-size: 1
# Share of the H200 while it runs next to the MoE and the small model; the
# three shares must add up to at most ~0.92. Alone, 0.90 gives ~1.49M tokens
# of KV cache; at 0.38 it is ~330k (28.4 GiB weights + ~3 GiB overhead).
gpu-memory-utilization: 0.38
# The model's native maximum. With the shared GPU only one request can use
# the full length at a time; shorter ones share the rest.
max-model-len: 262144
max-num-seqs: 64
enable-prefix-caching: true

enable-auto-tool-choice: true
tool-call-parser: qwen3_coder
reasoning-parser: qwen3

# Optional, once the base setup works — faster decoding if the checkpoint
# ships MTP weights (vLLM logs an error at startup otherwise):
# speculative-config: '{"method": "mtp", "num_speculative_tokens": 3}'
