# vLLM on a remote GPU host (e.g. IONOS), reachable only through Tailscale.
#
# vLLM shares the network namespace of the tailscale container and publishes
# no ports, so the OpenAI API is reachable only from the tailnet — never from
# the public internet. Talos connects to http://<tailscale-ip>:8000/v1.
#
# One model runs at a time; its settings are in models/<name>.yaml.
#
#   cp .env.example .env   # fill in TS_AUTHKEY, VLLM_API_KEY
#   ./run.sh qwen3.8-27b   # or: qwen3.8-flash-next, glm-5.3-flash
#   docker compose exec tailscale tailscale ip -4
#
# See README.md for the Talos side.

services:
  tailscale:
    image: tailscale/tailscale:${TAILSCALE_IMAGE_TAG:-stable}
    container_name: talos-llm-tailscale
    hostname: ${TS_HOSTNAME:-talos-llm}
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=${TS_HOSTNAME:-talos-llm}
      - TS_STATE_DIR=/var/lib/tailscale
      # Kernel networking (not userspace) — needed so vLLM's listening socket
      # is reachable on tailscale0 at full speed.
      - TS_USERSPACE=false
      # Fixed WireGuard port so a direct (non-DERP) connection is possible;
      # it is published below and must be allowed in the IONOS firewall.
      - TS_TAILSCALED_EXTRA_ARGS=--port=41641
      # e.g. --advertise-tags=tag:llm (needs tagOwners in the tailnet ACL;
      # tagged nodes also have key expiry disabled by default).
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:-}
    volumes:
      - tailscale-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      # WireGuard/UDP only. The vLLM port 8000 is intentionally NOT published.
      - "41641:41641/udp"

  vllm:
    image: vllm/vllm-openai:${VLLM_IMAGE_TAG:-v0.32.0}
    container_name: talos-llm-vllm
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      - tailscale
    ipc: host
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - hf-cache:/root/.cache/huggingface
      - ./models:/models:ro
    # Everything model-specific is in the YAML; vLLM reads it via --config and
    # the flags below take precedence over it.
    command: >
      --config /models/${MODEL_CONFIG:-qwen3.8-27b}.yaml
      --host 0.0.0.0
      --port 8000
      --api-key ${VLLM_API_KEY}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      # A first start downloads the weights (GLM-5.3-Flash: ~330 GB); use
      # `./run.sh download` beforehand to keep this short.
      start_period: 3600s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Fetches weights into the shared cache without starting a server:
  #   docker compose run --rm download Qwen/Qwen3.8-27B-FP8 [more ids ...]
  download:
    image: vllm/vllm-openai:${VLLM_IMAGE_TAG:-v0.32.0}
    profiles: [tools]
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - hf-cache:/root/.cache/huggingface
    entrypoint:
      - python3
      - -c
      - "import sys; from huggingface_hub import snapshot_download; [print(snapshot_download(m)) for m in sys.argv[1:]]"

volumes:
  tailscale-state:
  hf-cache:
