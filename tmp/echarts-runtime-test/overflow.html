<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overflow</title>
<style>
:root{--bg:#f9f9f7;--card:#fcfcfb;--fg:#0b0b0b;--muted:#52514e;--line:#e1e0d9;--up:#006300;--down:#d03b3b;--radius:14px;--td-s1:#2a78d6;--td-s2:#eb6834;--td-s3:#1baf7a;--td-s4:#eda100;--td-s5:#e87ba4;--td-s6:#008300;--td-s7:#4a3aa7;--td-s8:#e34948;--td-q1:#cde2fb;--td-q2:#9ec5f4;--td-q3:#5598e7;--td-q4:#2a78d6;--td-q5:#184f95;--td-good:#0ca30c;--td-warning:#fab219;--td-critical:#d03b3b;--td-surface:#fcfcfb;--td-ink:#0b0b0b;--td-ink2:#52514e;--td-muted:#898781;--td-grid:#e1e0d9;--td-base:#c3c2b7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0d;--card:#1a1a19;--fg:#ffffff;--muted:#c3c2b7;--line:#2c2c2a;--up:#0ca30c;--down:#d03b3b;--td-s1:#3987e5;--td-s2:#d95926;--td-s3:#199e70;--td-s4:#c98500;--td-s5:#d55181;--td-s6:#008300;--td-s7:#9085e9;--td-s8:#e66767;--td-q1:#104281;--td-q2:#1c5cab;--td-q3:#2a78d6;--td-q4:#5598e7;--td-q5:#9ec5f4;--td-good:#0ca30c;--td-warning:#fab219;--td-critical:#d03b3b;--td-surface:#1a1a19;--td-ink:#ffffff;--td-ink2:#c3c2b7;--td-muted:#898781;--td-grid:#2c2c2a;--td-base:#383835}}
:root[data-theme="dark"]{--bg:#0d0d0d;--card:#1a1a19;--fg:#ffffff;--muted:#c3c2b7;--line:#2c2c2a;--up:#0ca30c;--down:#d03b3b;--td-s1:#3987e5;--td-s2:#d95926;--td-s3:#199e70;--td-s4:#c98500;--td-s5:#d55181;--td-s6:#008300;--td-s7:#9085e9;--td-s8:#e66767;--td-q1:#104281;--td-q2:#1c5cab;--td-q3:#2a78d6;--td-q4:#5598e7;--td-q5:#9ec5f4;--td-good:#0ca30c;--td-warning:#fab219;--td-critical:#d03b3b;--td-surface:#1a1a19;--td-ink:#ffffff;--td-ink2:#c3c2b7;--td-muted:#898781;--td-grid:#2c2c2a;--td-base:#383835}
*{box-sizing:border-box}
body{margin:0;padding:24px;background:var(--bg);color:var(--fg);
font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{max-width:1400px;margin:0 auto 20px}
h1{margin:0 0 4px;font-size:1.6rem;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.92rem}
.wrap{max-width:1400px;margin:0 auto}
.kpis{display:grid;gap:14px;margin-bottom:18px;
grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.kpi-label{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
.kpi-value{font-size:1.7rem;font-weight:600;letter-spacing:-.02em;color:var(--fg)}
.kpi-delta{font-size:.85rem;color:var(--muted)}
.kpi-delta.up{color:var(--up)}.kpi-delta.down{color:var(--down)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
padding:16px 18px 12px;min-width:0}
.card.span2{grid-column:1/-1}
.card h2{margin:0 0 2px;font-size:1rem;font-weight:600}
.card .note{color:var(--muted);font-size:.82rem;margin:0 0 8px}
.chart{width:100%}
.chart-error{color:var(--down);font-size:.85rem;padding:12px;white-space:pre-wrap}
footer{max-width:1400px;margin:22px auto 0;color:var(--muted);font-size:.82rem}
@media(max-width:900px){.grid{grid-template-columns:1fr}.card.span2{grid-column:auto}
body{padding:14px}}

#td-downloads{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:0 auto 18px;max-width:1400px}
#td-downloads button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:8px 14px;cursor:pointer}
#td-downloads button:disabled{opacity:.6;cursor:wait}
#td-export-status{font-size:13px;color:var(--muted)}
#td-stage{margin:0 auto;position:relative}
#td-artboard{background:var(--bg);padding:32px;position:relative;transform-origin:top left}
#td-artboard .chart{position:relative}
body[data-page-format]:not([data-page-format="web"]) #td-artboard{overflow:hidden}
body[data-page-format]:not([data-page-format="web"]) #td-stage{overflow:hidden}
body[data-page-format]:not([data-page-format="web"]) .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
body[data-page-format="web"] #td-stage{max-width:1464px}
@media print{body{padding:0!important}#td-downloads{display:none}#td-stage{width:auto!important;height:auto!important}
#td-artboard{transform:none!important;box-shadow:none!important}}

</style>

;
/* Offline presentation sizing and downloads. Toolbar is outside the artwork. */
window.TalosDashboard = {
  init(config, originalHTML) {
    const art = document.getElementById('td-artboard');
    const stage = document.getElementById('td-stage');
    const status = document.getElementById('td-export-status');
    const pngButton = document.getElementById('td-save-png');
    const size = config.size;
    const filename = (config.title || 'dashboard').replace(/[^\p{L}\p{N}_-]+/gu, '-').slice(0, 100);
    document.body.dataset.pageFormat = config.format;
    if (size) {
      art.style.width = `${size[0]}px`;
      art.style.height = `${size[1]}px`;
      const printStyle = document.createElement('style');
      printStyle.textContent = `@page{size:${config.format === 'a4' ? 'A4 portrait' : config.format === 'a4-landscape' ? 'A4 landscape' : '338.667mm 190.5mm'};margin:0}`;
      document.head.appendChild(printStyle);
    }
    const fit = () => {
      if (!size) return;
      const bodyStyle = getComputedStyle(document.body);
      const available = document.body.clientWidth - parseFloat(bodyStyle.paddingLeft) - parseFloat(bodyStyle.paddingRight);
      const scale = Math.min(1, available / size[0]);
      art.style.transform = `scale(${scale})`;
      stage.style.width = `${size[0] * scale}px`;
      stage.style.height = `${size[1] * scale}px`;
    };
    fit();
    window.addEventListener('resize', fit);
    new ResizeObserver(fit).observe(document.body);
    function save(blob, extension) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `${filename}.${extension}`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }
    document.getElementById('td-save-html').onclick = () => save(new Blob([originalHTML], {type: 'text/html;charset=utf-8'}), 'html');

    async function png() {
      if (typeof htmlToImage !== 'object') throw new Error('PNG-Laufzeit fehlt. Sandbox-Image aktualisieren.');
      await document.fonts.ready;
      await Promise.all([...art.querySelectorAll('img')].map(img => img.decode()));
      await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      if (art.querySelector('.chart-error')) throw new Error('Bitte zuerst die Diagrammfehler beheben.');
      if (size && (art.scrollWidth > size[0] + 1 || art.scrollHeight > size[1] + 1)) {
        throw new Error('Der Inhalt passt nicht auf die Zeichenfläche. Layout kürzen oder ein größeres Format wählen.');
      }
      const width = size ? size[0] : art.offsetWidth;
      const height = size ? size[1] : art.scrollHeight;
      const outWidth = size ? size[2] : width * 2;
      const outHeight = size ? size[3] : height * 2;
      if (outWidth * outHeight > 32000000 || outWidth > 16000 || outHeight > 16000) {
        throw new Error('Diese Seite ist für einen PNG-Export zu groß. Bitte in mehrere Dashboards aufteilen.');
      }
      const scale = outWidth / width;
      // Capture ECharts directly, including WebGL, before cloning the DOM.
      const snapshots = {};
      for (const el of art.querySelectorAll('.chart')) {
        const host = window.TALOS_CHARTS?.[el.id];
        const chart = host?.chart;
        if (chart && !chart.isDisposed()) {
          // zrender's high-DPI repaint path omits external WebGL layers. Capture
          // those at native DPR and let the final composition scale the bitmap.
          const ratio = host.usesGL ? Math.min(scale, chart.getDevicePixelRatio()) : scale;
          snapshots[el.id] = chart.getDataURL({type: 'png', pixelRatio: ratio,
            backgroundColor: 'transparent', excludeComponents: ['toolbox']});
        }
      }
      const overlays = [], excluded = new Set();
      try {
        for (const [id, src] of Object.entries(snapshots)) {
          const host = document.getElementById(id);
          for (const child of host.children) excluded.add(child);
          const img = document.createElement('img');
          img.src = src;
          img.style.cssText = 'position:absolute;inset:0;display:block;width:100%;height:100%;pointer-events:none';
          host.appendChild(img);
          overlays.push(img);
          await img.decode();
        }
        // SVG foreignObject rendering avoids a nested iframe: those have a
        // different opaque origin in the Talos sandbox and cannot be accessed.
        const blob = await htmlToImage.toBlob(art, {
          width, height, canvasWidth: outWidth, canvasHeight: outHeight, pixelRatio: 1,
          backgroundColor: getComputedStyle(art).backgroundColor,
          style: {transform: 'none', margin: '0'},
          filter: node => !excluded.has(node),
        });
        if (!blob) throw new Error('PNG konnte nicht erstellt werden.');
        return blob;
      } finally { for (const img of overlays) img.remove(); }
    }
    window.TALOS_EXPORT = {png};
    if (pngButton) pngButton.onclick = async () => {
      pngButton.disabled = true;
      status.textContent = 'PNG wird erstellt …';
      try {
        save(await png(), 'png');
        status.textContent = 'PNG heruntergeladen.';
      } catch (error) {
        status.textContent = `Export fehlgeschlagen: ${error.message || error}`;
      } finally { pngButton.disabled = false; }
    };
  }
};

<nav id="td-downloads" aria-label="Downloads"><button type="button" id="td-save-html">HTML herunterladen</button><button type="button" id="td-save-png">PNG herunterladen</button><span id="td-export-status" role="status" aria-live="polite"></span></nav><div id="td-stage"><main id="td-artboard"><div style="height:900px">Too tall</div></main></div>
<script>
const originalHTML = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
TalosDashboard.init({"format":"16:9","size":[1280,720,1920,1080],"title":"Overflow"}, originalHTML);
// Fail loudly if the runtime didn't survive being inlined. A blank dashboard
// with a clean console is the hardest version of this to debug.
const specs = [];
const legacy = specs.filter(c => c.spec.type !== 'echarts');
const native = specs.filter(c => c.spec.type === 'echarts');
if ((legacy.length && typeof TalosCharts === 'undefined') ||
    (native.length && typeof TalosECharts === 'undefined')) {
  document.body.insertAdjacentHTML('afterbegin',
    '<p style="background:#fee;color:#900;padding:1rem">The chart runtime did not load: '
    + 'window.TalosCharts is ' + typeof TalosCharts + '. It must be inlined verbatim.</p>');
} else {
  // Each chart is mounted inside its own try/catch: one bad spec must leave a
  // message in its own card and let every later chart draw. The DOM host owns
  // resizing from here — it measures the container and follows it, and falls
  // back to a deterministic width while the card is still hidden, which is
  // where a preview panel starts.
  window.TALOS_CHARTS = Object.assign({},
    legacy.length ? TalosCharts.mountAll(legacy, {locale: "de-DE"}) : {},
    native.length ? TalosECharts.mountAll(native, {locale: "de-DE"}) : {});
}
</script>
