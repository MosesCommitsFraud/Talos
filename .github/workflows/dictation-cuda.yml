# GPU build of the dictation sidecar (services/dictation/Dockerfile.cuda),
# used by docker-compose.dictation-gpu.yml.
#
# Kept OUT of ci.yml on purpose: it compiles CTranslate2 from source against
# CUDA + cuDNN (~20-40 min cold), and paying that on every push to main would
# make the whole pipeline useless. It only rebuilds when the dictation sources
# change, or when you trigger it by hand.
#
# arm64 only, unlike every other image we publish. That is not an oversight:
# this Dockerfile exists *because* CTranslate2 ships no CUDA wheels for aarch64.
# On x86 the ordinary pip wheels already carry CUDA, so an x86 GPU host runs the
# plain `talos-dictation` image from ci.yml with DICTATION_DEVICE=cuda.
name: dictation-cuda

on:
  push:
    branches: [main]
    paths:
      - "services/dictation/**"
      - ".github/workflows/dictation-cuda.yml"
  workflow_dispatch:
    inputs:
      cuda_archs:
        description: 'CUDA_ARCHS (default targets GB10/sm_121; drop to "120-real;90-virtual" if nvcc rejects 121)'
        required: false
        default: "121-real;90-virtual"

concurrency:
  group: dictation-cuda-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: mosescommitsfraud
  IMAGE: talos-dictation-cuda

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    # The compile dominates; the default 6h cap is generous but a hung cmake
    # shouldn't burn a runner all afternoon.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      # The CUDA devel base plus the CTranslate2 build tree is tens of GB and
      # hosted runners ship with little headroom. Drop the preinstalled toolchains
      # we don't use rather than debugging a "no space left on device" 30 minutes
      # into a compile.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./services/dictation
          file: ./services/dictation/Dockerfile.cuda
          platforms: linux/arm64
          push: true
          provenance: false
          build-args: |
            CUDA_ARCHS=${{ inputs.cuda_archs || '121-real;90-virtual' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=dictation-cuda
          cache-to: type=gha,mode=max,scope=dictation-cuda

      - name: Inspect published manifest
        run: docker buildx imagetools inspect "$REGISTRY/$OWNER/$IMAGE:${{ github.sha }}"
